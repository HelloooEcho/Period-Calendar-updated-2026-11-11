<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Period Calendar Widget</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Product Sans", "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .calendar-card {
      width: 290px;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #f0f0f0;
      user-select: none;
    }

    /* 顶部标题：保持精致浅色斜体 */
    .app-title {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #8e8e93;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-style: italic;
    }

    /* 月份导航栏 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    /* 年月：字号比星期大一号，且加粗对齐原版视觉 */
    .month-year {
      font-size: 15px;
      font-weight: 700;
      color: #2c3e50;
    }
