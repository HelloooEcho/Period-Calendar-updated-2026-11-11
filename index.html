<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Period Calendar Widget</title>
  <!-- 引入 Google Sans 字体 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&display=swap">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* 优先使用 Google Sans / Product Sans */
      font-family: "Product Sans", "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .calendar-card {
      width: 280px;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #f0f0f0;
      user-select: none;
    }

    /* 顶部 App 风格标题 */
    .app-title {
      text-align: center;
      font-size: 11px;
      font-weight: 400;
      color: #999999;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-style: italic;
    }

    /* 月份导航栏 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    /* 比星期的 12px 大一个字号 (13px) */
    .month-year {
      font-size: 13px;
      font-weight: 500;
      color: #333333;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: #b0b0b0;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      color: #333;
      background: #f5f5f7;
    }

    /* 星期表头与日历网格 */
    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays {
      margin-bottom: 4px;
    }

    /* 星期字号 12px */
    .weekday {
      font-size: 12px;
      font-weight: 400;
      color: #a0a0a0;
      padding: 4px 0;
    }

    .days {
      row-gap: 4px;
    }

    /* 日期数字：取消粗体，恢复自然纤细感 */
    .day {
      font-size: 12px;
      font-weight: 400;
      color: #333333;
      height: 30px;
      width: 30px;
      line-height: 30px;
      margin: 0 auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .day:empty {
      cursor: default;
    }

    /* 经期高亮粉红圆圈 */
    .day.period {
      background: linear-gradient(135deg, #ff5e7e 0%, #ff3b68 100%);
      color: #ffffff;
      font-weight: 500;
      box-shadow: 0 3px 8px rgba(255, 60, 100, 0.35);
    }

    .day:not(:empty):hover {
      transform: scale(1.08);
    }
  </style>
</head>
<body>

  <div class="calendar-card">
    <!-- 主标题 -->
    <div class="app-title">𝑷𝒆
